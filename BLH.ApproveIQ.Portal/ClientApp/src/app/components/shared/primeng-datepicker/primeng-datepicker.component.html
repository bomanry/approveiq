<div class="field">
  <label [for]="name" class="block">{{label}} <span *ngIf="control.hasValidator(Validators.required)"
                                                    class="required-asterisk">*</span></label>
  <p-calendar hourFormat="12" [showTime]="showTime" [id]="name" [name]="name" [formControl]="control" [timeOnly]="timeOnly"
              [disabledDays]="disabledDays" [attr.aria-describedby]="name+'-help'" [showIcon]="true" [stepMinute]="stepMinute"
              [appendTo]="'body'" [showOnFocus]="false"></p-calendar>

  <ng-container *ngIf="control.touched || control.dirty">
    <small [id]="name+'-help'" class="p-error block" *ngIf="control?.errors?.required">
      {{label}} is required.
    </small>
    <small [id]="name+'-help'" class="p-error block" *ngIf="control?.errors?.email">
      {{label}} is not valid.
    </small>
    <small [id]="name+'-help'" class="p-error block" *ngIf="control?.errors?.pattern">
      {{label}} is not valid.
    </small>
  </ng-container>
</div>
