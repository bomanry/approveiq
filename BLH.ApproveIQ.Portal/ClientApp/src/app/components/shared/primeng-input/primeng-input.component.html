<div class="field">
    <label [for]="name" class="block">{{label}} <span *ngIf="control.hasValidator(Validators.required)"
            class="required-asterisk">*</span></label>
    
    <!-- Input with mask when mask is provided -->
    <input *ngIf="mask" 
           [id]="name" 
           [name]="name" 
           [formControl]="control" 
           [type]="type" 
           [attr.aria-describedby]="name+'-help'" 
           pInputText
           [attr.autocomplete]="autocomplete" 
           [mask]="mask" 
           [prefix]="prefix" 
           [thousandSeparator]="thousandSeparator" 
           [allowNegativeNumbers]="allowNegativeNumbers" />
    
    <!-- Regular input without mask -->
    <input *ngIf="!mask" 
           [id]="name" 
           [name]="name" 
           [formControl]="control" 
           [type]="type" 
           [attr.aria-describedby]="name+'-help'" 
           pInputText
           [attr.autocomplete]="autocomplete" />
    
    <ng-container *ngIf="control.touched || control.dirty">
        <small [id]="name+'-help'" class="p-error block" *ngIf="control?.errors?.required">
            {{label}} is required.
        </small>
        <small [id]="name+'-help'" class="p-error block" *ngIf="control?.errors?.email">
            {{label}} is not valid.
        </small>
        <small [id]="name+'-help'" class="p-error block" *ngIf="control?.errors?.pattern">
            {{label}} is not valid.
        </small>
    </ng-container>
</div>
