<nav class="d-print-none">
  <p-menubar [model]="(items | async) ?? []"  [style]="{ position: 'relative', backgroundColor: 'rgb(0, 38, 57)',
    border: 'none', borderRadius: '0', color: '#fff' }" class="spk-navbar">
    <ng-template pTemplate="start">
      <a routerLink="/">
        <img src="assets/logo.png" alt="Logo" class="d-inline-block mr-3"  style="height: 2em;margin-left:20px;">
      </a>
      <span class="h2 vertical-align-middle mr-3 cursor-pointer title-text" (click)="goHome()">ApproveIQ</span>
    </ng-template>
    <ng-template pTemplate="end">
      <div *ngIf="logoutItem | async as logout" class="flex align-items-center">
        <button pButton type="button" 
                [icon]="logout.icon || ''" 
                [label]="logout.label || ''"
                (click)="logout.command && logout.command()"
                class="p-button-text p-button-plain"
                style="color: white;">
        </button>
      </div>
    </ng-template>
  </p-menubar>
</nav>
