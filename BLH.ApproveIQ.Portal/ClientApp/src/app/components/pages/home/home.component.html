<div class="container mt-4">
  <edit-header
    title="Dashboard"
    [showBackButton]="false">
  </edit-header>

  <!-- Summary Cards Row -->
  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card bg-warning text-white">
        <div class="card-body">
          <h5 class="card-title">New Invoices</h5>
          <h2 class="card-text text-black">{{ newInvoicesCount }}</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card bg-primary text-white">
        <div class="card-body">
          <h5 class="card-title">Pending Review</h5>
          <h2 class="card-text text-black">{{ pendingInvoicesCount }}</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card bg-info text-white">
        <div class="card-body">
          <h5 class="card-title">Pending Approval</h5>
          <h2 class="card-text text-black">{{ pendingApprovalCount }}</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card bg-success text-white">
        <div class="card-body">
          <h5 class="card-title">Total Value</h5>
          <h2 class="card-text text-black">${{ totalValue | number:'1.2-2' }}</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- Incoming Invoices Section -->
  <div class="row">
    <div class="col-12">
      <div *ngIf="pendingInvoices.length === 0 && !loading" class="text-center py-4 text-muted">
        <i class="fas fa-inbox fa-3x mb-3"></i>
        <h5>No invoices assigned</h5>
        <p>You're all caught up! No invoices are currently assigned to you.</p>
      </div>
      
      <div *ngIf="pendingInvoices.length > 0 || loading">
        <primeng-table
          [dataList]="pendingInvoices"
          [cols]="cols"
          [loading]="loading"
          [totalRecords]="totalRecords"
          [lazy]="false"
          [globalFilterFields]="globalFilterFields"
          [hasSearchBox]="true"
          [hasClearFilters]="true"
          [hasAddAction]="false"
          [hasEditButton]="true"
          [hasDeleteButton]="false"
          [hasCsvExport]="false"
          editButtonLabel=""
          customEditIcon="pi pi-eye"
          [actionLinks]="actionLinks"
          (onLazyLoad)="onLazyLoad($event)"
          (onEditClicked)="onEditClicked($event)">
        </primeng-table>
      </div>
    </div>
  </div>
</div>
